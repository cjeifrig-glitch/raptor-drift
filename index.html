<style>
/* Layout: full-screen WebGL canvas, HUD pinned to the corners, minimap top-right, car picker on the start screen, touch pad along the bottom on phones. */
:root{
  --bg:#141618;          /* wet asphalt */
  --fg:#f1f0ec;          /* chalk */
  --dim:rgba(241,240,236,.55);
  --accent:#ff7a1a;      /* Ford Code Orange */
  --good:#7ee787;
  --bad:#ff5d5d;
  --panel:rgba(14,16,18,.62);
  --display:'Bebas Neue','Barlow Condensed',Impact,sans-serif;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--num);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.speed{display:flex;align-items:baseline;gap:6px;line-height:1}
.speed b{font:700 72px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-1px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.speed span{font:500 18px var(--num);color:var(--dim);letter-spacing:2px;text-transform:uppercase}
.gear{font:400 22px var(--display);color:var(--accent);letter-spacing:2px;margin-top:2px}
.rpm{width:150px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:8px;overflow:hidden}
.rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffd27a);border-radius:3px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.laps{text-align:right;font-variant-numeric:tabular-nums}
.laps .t{font:700 40px/1 var(--num);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.laps .l{font:500 14px var(--num);color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.laps .l b{color:var(--fg);font-weight:700}
.split{font:700 22px/1 var(--num);letter-spacing:1px;min-height:22px;opacity:0;transition:opacity .2s;font-variant-numeric:tabular-nums}
.split.on{opacity:1}
.split.good{color:var(--good)}.split.bad{color:var(--bad)}
#map{width:170px;height:120px;opacity:.9}
.drift{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .15s}
.drift.on{opacity:1}
.drift .pts{font:400 54px/1 var(--display);color:var(--accent);text-shadow:0 0 18px rgba(255,122,26,.55)}
.drift .ang{font:500 15px var(--num);letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.drift .combo{font:400 20px var(--display);letter-spacing:2px;color:var(--fg)}
.total{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);text-align:center;font:500 14px var(--num);letter-spacing:3px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.total b{display:block;font:400 30px/1 var(--display);color:var(--fg);letter-spacing:1px}
.total small{display:block;font:500 12px var(--num);letter-spacing:2px;color:var(--accent)}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);font:400 64px/1 var(--display);color:var(--accent);letter-spacing:4px;opacity:0;transition:opacity .25s;text-shadow:0 0 30px rgba(255,122,26,.5);white-space:nowrap}
.toast.on{opacity:1}
.hint{font:500 13px var(--num);letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.hint kbd{font:700 12px var(--num);color:var(--fg);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:1px 6px}
#start{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);background:linear-gradient(180deg,rgba(8,9,10,.55) 0%,rgba(8,9,10,0) 30%,rgba(8,9,10,0) 50%,rgba(8,9,10,.88) 100%);z-index:5}
#start.gone{display:none}
.card{text-align:center;padding:12px 24px;max-width:94vw}
.card h1{font:400 clamp(44px,8vw,76px)/0.9 var(--display);margin:0;letter-spacing:2px;color:var(--fg);text-wrap:balance}
.card h1 em{font-style:normal;color:var(--accent)}
.card p{margin:8px 0 0;font:500 15px var(--num);letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.cars{display:flex;justify-content:center;gap:12px;margin:14px 0 6px;flex-wrap:wrap}
.car{pointer-events:auto;cursor:pointer;text-align:left;background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 14px;min-width:200px;color:var(--fg);font-family:var(--num)}
.car b{display:block;font:400 22px/1 var(--display);letter-spacing:1px}
.car span{display:block;font:500 12px var(--num);letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-top:4px}
.car i{display:block;font:500 12px var(--num);letter-spacing:1px;color:var(--accent);margin-top:4px;font-style:normal}
.car.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 30px rgba(255,122,26,.25)}
.car:disabled{opacity:.55;cursor:not-allowed}
.themes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.themes button{pointer-events:auto;cursor:pointer;font:500 12px var(--num);letter-spacing:2px;text-transform:uppercase;color:var(--dim);background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 12px}
.themes button.sel{color:var(--fg);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.keys{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:10px 0 4px}
.keys div{font:500 12px var(--num);letter-spacing:2px;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;gap:5px;align-items:center}
.keys kbd{font:700 14px var(--num);color:var(--fg);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:3px 9px;min-width:30px}
.go{pointer-events:auto;margin-top:10px;font:400 30px var(--display);letter-spacing:4px;color:#140c06;background:var(--accent);border:0;border-radius:8px;padding:11px 42px;cursor:pointer;box-shadow:0 8px 30px rgba(255,122,26,.35)}
.go:disabled{opacity:.6;cursor:wait}
.go:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.best{margin-top:10px;font:500 13px var(--num);letter-spacing:2px;text-transform:uppercase;color:var(--accent);min-height:16px}
.pad{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:4}
.pad .grp{display:flex;gap:10px;pointer-events:auto}
.pad button{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(14,16,18,.5);color:var(--fg);font:400 30px var(--display);backdrop-filter:blur(6px);touch-action:none;-webkit-tap-highlight-color:transparent}
.pad button.hb{width:60px;height:60px;font-size:18px;letter-spacing:1px}
.pad button:active,.pad button.down{background:var(--accent);color:#140c06;border-color:var(--accent)}
.touch .pad{display:flex}
.touch .hint{display:none}
.touch .total{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
.touch .speed b{font-size:52px}
.touch .laps .t{font-size:30px}
.touch #map{width:120px;height:85px}
.btns{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 150px);display:flex;flex-direction:column;gap:8px;z-index:4}
.touch .btns{top:calc(env(safe-area-inset-top,0px) + 120px)}
.btns button{pointer-events:auto;font:500 12px var(--num);letter-spacing:2px;text-transform:uppercase;color:var(--fg);background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left}
.flash{position:absolute;inset:0;pointer-events:none;background:rgba(255,255,255,0)}
@media (prefers-reduced-motion:reduce){.toast,.drift,.split{transition:none}}
</style>

<canvas id="c"></canvas>
<div class="flash" id="flash"></div>

<div class="hud">
  <div class="row">
    <div>
      <div class="speed"><b id="spd">0</b><span>mph</span></div>
      <div class="gear" id="gear">N</div>
      <div class="rpm"><i id="rpm"></i></div>
    </div>
    <div class="right">
      <div class="laps">
        <div class="t" id="lapt">0:00.00</div>
        <div class="l">lap <b id="lapn">0</b> &nbsp; best <b id="best">--</b></div>
      </div>
      <div class="split" id="split"></div>
      <canvas id="map" width="340" height="240"></canvas>
    </div>
  </div>
  <div class="row">
    <div class="hint"><kbd>W</kbd>/<kbd>&uarr;</kbd> gas &nbsp; <kbd>S</kbd>/<kbd>&darr;</kbd> brake &nbsp; <kbd>A</kbd> <kbd>D</kbd> / <kbd>&larr;</kbd> <kbd>&rarr;</kbd> steer &nbsp; <kbd>space</kbd> e-brake &nbsp; <kbd>C</kbd> camera &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>esc</kbd> garage</div>
  </div>
</div>
<div class="drift" id="drift"><div class="pts" id="dpts">0</div><div class="ang" id="dang">0&deg; drift</div><div class="combo" id="dcombo"></div></div>
<div class="total">drift points<b id="total">0</b><small id="bestpts"></small></div>
<div class="toast" id="toast"></div>
<div class="btns"><button id="snd" type="button">sound off</button><button id="cam" type="button">camera: chase</button><button id="ghostbtn" type="button">ghost: on</button><button id="assistbtn" type="button">assist: on</button><button id="gfxbtn" type="button">graphics: high</button></div>

<div class="pad" id="pad">
  <div class="grp"><button data-k="left" type="button">&lsaquo;</button><button data-k="right" type="button">&rsaquo;</button></div>
  <div class="grp"><button class="hb" data-k="hb" type="button">E</button><button data-k="brake" type="button">&darr;</button><button data-k="gas" type="button">&uarr;</button></div>
</div>

<div id="start">
  <div class="card">
    <h1>RAPTOR <em>DRIFT</em></h1>
    <p>Ridge Circuit &middot; wet &middot; beat the lap, race your ghost</p>
    <div class="cars" id="cars"></div>
    <div class="themes" id="themes"></div>
    <div class="keys">
      <div><kbd>W</kbd>gas</div><div><kbd>S</kbd>brake</div><div><kbd>A D</kbd>steer</div><div><kbd>space</kbd>e-brake</div><div><kbd>C</kbd>camera</div><div><kbd>R</kbd>reset</div>
    </div>
    <div class="best" id="best2"></div>
    <button class="go" id="go" type="button">DRIVE</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('go').textContent='3D failed to load';return;}
const $=id=>document.getElementById(id);
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(isTouch)document.body.classList.add('touch');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------------- cars ---------------- */
const CARS={
  raptor:{id:'raptor',name:'2024 Ford F-150 Raptor R',sub:'700 hp · 2.7 t · rear-drive mode',glb:'RAPTORR_GLB_B64',camH:3.3,hoodH:2.0,
    m:2700,a:1.75,b:1.95,track:1.75,h:0.92,rW:0.44,Tmax:870,redline:6500,idle:800,gears:[3.9,2.4,1.65,1.25,1.0,0.8],final:3.55,
    drag:1.15,roll:420,brake:1.25,muF:1.0,muR:0.85,CF:1.3,CR:1.08,BF:11,BR:16,assist:0.25,driveCap:2.2,spinFloor:0.08,steerMax:0.66,steerSpeed:70,steerRate:10,rollStiffF:0.55,bodyRoll:0.012,pitch:0.008},
  dbs:{id:'dbs',name:'Aston Martin DBS Superleggera',sub:'715 hp · 1.85 t · rear-drive',glb:'DBS_GLB_B64',camH:2.1,camDist:7.4,hoodH:1.15,
    m:1850,a:1.37,b:1.43,track:1.66,h:0.5,rW:0.35,Tmax:900,redline:7000,idle:850,gears:[4.7,3.1,2.1,1.6,1.25,1.0],final:2.93,
    drag:0.62,roll:260,brake:1.5,muF:1.04,muR:0.9,CF:1.32,CR:1.08,BF:13,BR:22,assist:0.3,driveCap:2.0,spinFloor:0.1,steerMax:0.64,steerSpeed:80,rollStiffF:0.52,bodyRoll:0.007,pitch:0.005}
};
let carId='raptor';try{const c=localStorage.getItem('rd-car');if(c&&CARS[c]&&!CARS[c].pending)carId=c;}catch(e){}
let C=CARS[carId];

/* ---------------- renderer / scene ---------------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();
/* ---------------- settings (same track, same grip, different world) ---------------- */
/* sun: [azimuth deg, elevation deg]; ground: [texture set, near tint, far tint, tile repeat]; fogD: exp2 density */
const THEMES={
  japan:{name:'Japan touge',sub:'cedar forest · mist · maples',sun:[250,16],turb:9,ray:2.4,mie:0.006,exposure:0.85,fogD:0.0030,fogCol:0xb7c3c6,hemi:[0xcfd9dd,0x2b3b31,0.55],sunI:1.1,
    ground:['Moss001',0xc8d2bf,0x8fa08a,30],mtn:{tex:'Rock030',amp:260,snowline:9e9,tint:0x7f8a86},trees:[['pine',0.17,0.55,0xffffff],['spruce',1.25,0.45,0xf4f6f0]],density:1500,minD:6,far:['pine',0.17,1,0xffffff],accent:['oak',0.45,120,0xd2602c],rail:0xf0f0f0},
  pch:{name:'PCH cliffs',sub:'ocean · golden grass · sun',sun:[235,28],turb:4,ray:1.2,mie:0.004,exposure:1.0,fogD:0.0011,fogCol:0xc8d8e6,hemi:[0xe8f0f8,0x6a5a3a,0.6],sunI:1.6,
    ground:['Ground037',0xe6c878,0xb89a50,28],mtn:{tex:'Rock030',amp:150,snowline:9e9,tint:0xb8a383},cliff:true,ocean:true,trees:[['veg',0.5,1.0,0xffffff],['oak',0.35,0.15,0xd8d0a0]],density:1100,minD:7,accent:['veg',0.4,120,0xffffff],rail:0xc4c7cc},
  colorado:{name:'Colorado snow',sub:'snowy pines · peaks · cold light',sun:[225,20],turb:3,ray:1.8,mie:0.003,exposure:0.95,fogD:0.0018,fogCol:0xd6e0ea,hemi:[0xe3ecf5,0x8f9fb0,0.7],sunI:1.4,
    ground:['Snow006',0xffffff,0xf2f6fa,22],mtn:{tex:'Rock030',amp:330,snowline:40,tint:0x8a8f93},snow:true,trees:[['pine',0.17,0.55,0xcfd9e2],['spruce',1.25,0.45,0xd6dee6]],density:1500,minD:6,far:['pine',0.17,1,0xcfd9e2],accent:null,rail:0xc4c7cc},
  forest:{name:'Deep forest',sub:'tall trees · dappled light · moss',sun:[260,34],turb:6,ray:2.0,mie:0.008,exposure:0.9,fogD:0.0045,fogCol:0xa9bf9c,hemi:[0xc9dcc0,0x1f2e1c,0.5],sunI:1.3,
    ground:['Ground037',0xd8d0b8,0x9a9a7a,26],mtn:{tex:'Rock030',amp:120,snowline:9e9,tint:0x5f7a5a},trees:[['oak',0.6,0.5,0xffffff],['spruce',1.3,0.5,0xf0f4ea]],density:1500,minD:3,spread:520,far:['pine',0.17,1,0xd8e4d0],accent:['veg',0.45,260,0xffffff],rail:0xb9bcc2}
};
let themeId='japan';try{const t=localStorage.getItem('rd-theme');if(t&&THEMES[t])themeId=t;}catch(e){}
let gfxHigh=true;try{gfxHigh=localStorage.getItem('rd-gfx')!=='low';}catch(e){}
let T=THEMES[themeId];
scene.background=new THREE.Color(0x9aa4ad);
scene.fog=new THREE.FogExp2(T.fogCol,T.fogD);
const camera=new THREE.PerspectiveCamera(62,1,0.5,6000);

const hemi=new THREE.HemisphereLight(0xc9d3dc,0x2f3a2c,0.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe2c4,1.15);
sun.position.set(-120,90,60);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;
sun.shadow.camera.near=10;sun.shadow.camera.far=400;sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;
scene.add(sun);scene.add(sun.target);
const sunDir=new THREE.Vector3(0,1,0);
/* physically based sky (three.js Sky) */
let sky=null;
if(THREE.Sky){sky=new THREE.Sky();sky.scale.setScalar(5000);scene.add(sky);}
function setSky(){
  const az=T.sun[0]*Math.PI/180,el=T.sun[1]*Math.PI/180;
  sunDir.set(Math.cos(el)*Math.sin(az),Math.sin(el),Math.cos(el)*Math.cos(az)).normalize();
  if(sky){const u=sky.material.uniforms;u.turbidity.value=T.turb;u.rayleigh.value=T.ray;u.mieCoefficient.value=T.mie;u.mieDirectionalG.value=0.8;u.sunPosition.value.copy(sunDir);}
  renderer.toneMappingExposure=T.exposure;
  sun.color.setHex(0xfff2e0);sun.intensity=T.sunI;hemi.color.setHex(T.hemi[0]);hemi.groundColor.setHex(T.hemi[1]);hemi.intensity=T.hemi[2];
  scene.fog.color.setHex(T.fogCol);scene.fog.density=T.fogD;scene.background=new THREE.Color(T.fogCol);
}
let envMap=null;
function bakeEnv(){
  try{
    const pm=new THREE.PMREMGenerator(renderer);
    let tex;
    if(sky){const es=new THREE.Scene();es.add(sky);const gl=new THREE.Mesh(new THREE.CircleGeometry(4000,24),new THREE.MeshBasicMaterial({color:T.ground[2]}));gl.rotation.x=-Math.PI/2;gl.position.y=-2;es.add(gl);tex=pm.fromScene(es,0.02).texture;scene.add(sky);}
    else{const es=new THREE.Scene();es.background=new THREE.Color(T.fogCol);tex=pm.fromScene(es,0.04).texture;}
    const old=envMap;envMap=tex;scene.environment=envMap;
    scene.traverse(o=>{if(o.isMesh&&o.material&&('envMap' in o.material)&&o.material.userData.wantsEnv&&o.material.envMap!==envMap){o.material.envMap=envMap;o.material.needsUpdate=true;}});
    if(old)old.dispose();
  }catch(e){envMap=null;console.error('env bake failed',e);}
}

/* ---------------- textures ---------------- */
function noiseTex(base,amp,size,rep){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,size,size);

/* ---------------- camera + loop ---------------- */
const camPos=new THREE.Vector3(S.x-Math.sin(S.th)*9,S.y+3.6,S.z-Math.cos(S.th)*9);

  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',

function frame(){
  requestAnimationFrame(frame);
